name: NTMDashboard
options:
  bundleIdPrefix: com.ntm
  minimumXcodeVersion: "16.0"
  defaultConfig: Debug
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete

configs:
  Debug: debug
  Release: release

targets:
  NTMDashboard:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NTMDashboard/NTMDashboard
        excludes:
          - "**/*.md"
    resources:
      - path: NTMDashboard/NTMDashboard/Resources/Assets.xcassets
    entitlements:
      path: NTMDashboard/NTMDashboard/NTMDashboard.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:ntm.happyhomelives.me
    info:
      path: NTMDashboard/NTMDashboard/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntm.NTMDashboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: W65LG3MSG6
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.14.0"
        CURRENT_PROJECT_VERSION: "22"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          # Pin to Apple Distribution so Automatic signing cannot regress to
          # the personal-team Development cert when archiving for TestFlight /
          # App Store. See ios/certs/AppleDistribution-W65LG3MSG6.cer.
          CODE_SIGN_IDENTITY: "Apple Distribution: Dong Xue (W65LG3MSG6)"
    scheme:
      testTargets:
        - name: NTMDashboardTests

  NTMDashboardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NTMDashboard/NTMDashboardTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntm.NTMDashboardTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: W65LG3MSG6
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NTMDashboard
