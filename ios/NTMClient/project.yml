name: NTMClient
options:
  bundleIdPrefix: com.ntm
  minimumXcodeVersion: "16.0"
  defaultConfig: Debug
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete

configs:
  Debug: debug
  Release: release

targets:
  NTMClient:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NTMClient
        excludes:
          - "**/*.md"
    resources:
      - path: NTMClient/Resources/Assets.xcassets
    info:
      path: NTMClient/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntm.NTMClient
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: NTMClient/NTMClient.entitlements
    scheme:
      testTargets: []
