name: NTMClient
options:
  bundleIdPrefix: com.ntm
  minimumXcodeVersion: "16.0"
  defaultConfig: Debug
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete

configs:
  Debug: debug
  Release: release

targets:
  NTMClient:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NTMClient
        excludes:
          - "**/*.md"
      - path: Shared
    resources:
      - path: NTMClient/Resources/Assets.xcassets
    info:
      path: NTMClient/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntm.NTMClient
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: NTMClient/NTMClient.entitlements
    dependencies:
      - target: NTMClientPacketTunnel
        embed: true
    scheme:
      testTargets: []

  NTMClientPacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PacketTunnel
        excludes:
          - "**/*.md"
      - path: Shared
    info:
      path: PacketTunnel/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntm.NTMClient.PacketTunnel
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # NEPacketTunnelProvider is callback-based Obj-C; Swift 5 + minimal avoids false-positive
        # sendability errors on completion handlers and NEPacketTunnelFlow captures.
        SWIFT_STRICT_CONCURRENCY: minimal
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
