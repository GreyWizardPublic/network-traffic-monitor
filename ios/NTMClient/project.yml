name: NTMClient
options:
  bundleIdPrefix: com.ntm
  minimumXcodeVersion: "16.0"
  defaultConfig: Debug
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete

configs:
  Debug: debug
  Release: release

targets:
  NTMClient:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NTMClient
        excludes:
          - "**/*.md"
      - path: Shared
    resources:
      - path: NTMClient/Resources/Assets.xcassets
    info:
      path: NTMClient/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntm.NTMClient
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: W65LG3MSG6
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "4"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "NTMClient AppStore"
    entitlements:
      path: NTMClient/NTMClient.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.developer.associated-domains:
          - webcredentials:ntm.happyhomelives.me
    dependencies:
      - target: NTMClientPacketTunnel
        embed: true
    scheme:
      testTargets:
        - name: NTMClientTests

  NTMClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NTMClientTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntm.NTMClientTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: W65LG3MSG6
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NTMClient

  NTMClientPacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PacketTunnel
        excludes:
          - "**/*.md"
      - path: Shared
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: NTMClient PacketTunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntm.NTMClient.PacketTunnel
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # NEPacketTunnelProvider is callback-based Obj-C; Swift 5 + minimal avoids false-positive
        # sendability errors on completion handlers and NEPacketTunnelFlow captures.
        SWIFT_STRICT_CONCURRENCY: minimal
        DEVELOPMENT_TEAM: W65LG3MSG6
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "4"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "NTMClient PacketTunnel AppStore"
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
